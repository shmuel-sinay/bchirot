<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אחוזי הצבעה לפי שכונות</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>אחוזי הצבעה לפי שכונות</h1>
  <p class="note" id="note"></p>
  <label>בחר עיר: <select id="city"></select></label>
  <label>מיון: <select id="sort">
    <option value="desc">מהגבוה לנמוך</option>
    <option value="asc">מהנמוך לגבוה</option>
  </select></label>
  <table>
    <thead><tr><th>#</th><th>שכונה</th><th>אחוז הצבעה</th><th>בעלי זכות</th><th>הצביעו</th><th>גוש מוביל</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
<section id="exit">
  <h2>מדגמי יציאה</h2>
  <p class="note">הדבק לכל ערוץ שורות בפורמט <code>שם מפלגה: מנדטים</code> (למשל <code>הליכוד: 30</code>). הנתונים נשמרים בדפדפן בלבד.</p>
  <div id="channels"></div>
  <button id="calc">הצג והשווה</button>
  <table id="exitTable"></table>
</section>
</main>
<script src="app.js"></script>
<script src="exitpoll.js"></script>
</body>
</html>
